# Builds the C shell and runs the Ruby suite against both implementations,
# on mudge's Forgejo runner in a Linux container. `make` at the top level is
# the whole check so CI runs exactly what a local `make` does.
#
# No `uses:` steps on purpose. Actions get fetched from data.forgejo.org at
# job start, which has already broken once, and actions/checkout needs Node
# inside the container anyway. A shallow fetch with the job token is all
# the checkout needs, and the full ruby image has git for it.
#
# The image is pinned to the Ruby in ruby/.ruby-version by hand. The full
# image is built on buildpack-deps, so gcc and the readline headers are
# already there; the apt step is a cheap guarantee in case that changes.
# `make bootstrap` isn't used because it reaches for sudo, which the
# container doesn't have.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "Readme.md"
      - "a1.pdf"
  pull_request:
    paths-ignore:
      - "Readme.md"
      - "a1.pdf"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and tests
    # The runner maps this label to a plain image; the container below is
    # what actually runs.
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.5
    timeout-minutes: 10
    steps:
      - name: Check out
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
          git init -q .
          git fetch -q --depth 1 "${GITHUB_SERVER_URL/https:\/\//https://x-access-token:${GITHUB_TOKEN}@}/${GITHUB_REPOSITORY}.git" "${GITHUB_REF:-$GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git --no-pager log -1 --oneline
          test -f Makefile || { echo "checkout is empty"; exit 1; }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install readline
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends libreadline-dev
      - name: Install gems
        run: bundle install --jobs 4 --retry 3
        working-directory: ruby
      - name: Build and tests
        run: make

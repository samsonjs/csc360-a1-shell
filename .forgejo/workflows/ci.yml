# Builds the C shell and runs the Ruby suite against both implementations,
# on mudge's Forgejo runner in a Linux container. `make` at the top level is
# the whole check so CI runs exactly what a local `make` does.
#
# The checkout is sjs/actions/checkout, referenced by full URL so the runner
# fetches it from git.samhuri.net rather than data.forgejo.org, which has
# broken once. It's plain git with the job token, so the official ruby image
# works without Node, unlike actions/checkout.
#
# The image is pinned to the Ruby in ruby/.ruby-version by hand. The full
# image is built on buildpack-deps, so gcc and the readline headers are
# already there; the apt step is a cheap guarantee in case that changes.
# `make bootstrap` isn't used because it reaches for sudo, which the
# container doesn't have.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "Readme.md"
      - "a1.pdf"
  pull_request:
    paths-ignore:
      - "Readme.md"
      - "a1.pdf"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and tests
    # The runner maps this label to a plain image; the container below is
    # what actually runs.
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.5
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
        with:
          require-file: Makefile
      - name: Install readline
        uses: https://git.samhuri.net/sjs/actions/apt-install@v1
        with:
          packages: libreadline-dev
      - name: Install gems
        run: bundle install --jobs 4 --retry 3
        working-directory: ruby
      - name: Build and tests
        run: make
